<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>InstanceUtil</title>
    <script>
      // Single Page Apps for GitHub Pages
      // Works for both github.io/repo/ subpaths (segmentCount = 1) and custom domains (segmentCount = 0)
      var isSubpath = window.location.hostname.endsWith('github.io');
      var segmentCount = isSubpath ? 1 : 0;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + segmentCount).join('/') + '/?p=/' +
        l.pathname.slice(1).split('/').slice(segmentCount).join('/').replace(/&/g, '~and~') +
        (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
  </body>
</html>
